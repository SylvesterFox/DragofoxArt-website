services:
  app:
    build: .
    image: ghcr.io/sylvesterfox/dragofoxart-website:local
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your environment or .env file}"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    expose:
      - "8000"
    volumes:
      - database:/data
      - media:/app/media
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/usr/share/nginx/html/media:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  database:
  media:
