{% extends "base.html" %}

{% block title %}{{ art.title }} — SylvesterNotCute{% endblock %}

{% block content %}
<section class="panel page-section">
  <h1 class="section__title">{{ art.title }}</h1>
  <div class="rule"></div>

  <div class="detail">
    <img src="{{ art.image.url }}" alt="{{ art.title }}">
    {% if art.description %}<p class="detail__text">{{ art.description }}</p>{% endif %}
  </div>

  <div class="back-link">
    <a class="btn" href="{% url 'artlog:gallery' %}" style="width: 204px; padding-inline: 0;">← Back to Gallery</a>
  </div>
</section>
{% endblock %}
